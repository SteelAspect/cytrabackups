name: Release

# Pushing a tag like v1.2.0 builds the mod, runs the unit tests and server GameTests,
# and publishes a GitHub release with the jar attached. Release notes come from CHANGELOG.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests and server GameTests
        run: ./gradlew build --no-daemon

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "See CHANGELOG.md" > release-notes.md; fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: CytraBackups ${{ github.ref_name }} for Minecraft 1.21.11
          body_path: release-notes.md
          files: |
            build/libs/cytrabackups-*.jar
