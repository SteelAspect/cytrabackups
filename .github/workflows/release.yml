name: Release

# Builds the mod, runs the unit tests and server GameTests, and publishes a GitHub release with only the mod jar attached.
# Runs when a tag like v1.2.0 is pushed, or manually ("Run workflow"): then the version comes from gradle.properties
# and the tag v<version> is created on the selected branch. Release notes come from CHANGELOG.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version=$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build, unit tests and server GameTests
        run: ./gradlew build --no-daemon

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "See CHANGELOG.md" > release-notes.md; fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CytraBackups ${{ steps.version.outputs.version }} for Minecraft 1.21.11
          body_path: release-notes.md
          make_latest: true
          files: build/libs/cytrabackups-${{ steps.version.outputs.version }}.jar

      - name: Ship only the mod jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset "v${{ steps.version.outputs.version }}" "cytrabackups-${{ steps.version.outputs.version }}-sources.jar" -y -R "${{ github.repository }}" || true
