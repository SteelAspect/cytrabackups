plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
	mavenLocal {
		content { includeModule 'dev.steelaspect', 'alloy-ui' }
	}
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/cytrabackups.accesswidener")

	mods {
		"cytrabackups" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Off-site integration tests run against real embedded servers (S3Proxy, Apache MINA SSHD, Tomcat WebDAV).
// They live in their own source set without Minecraft on the classpath: ./gradlew integrationTest
sourceSets {
	integrationTest {
		java.srcDir "src/integrationTest/java"
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

// Headless GameTests live in src/gametest and run with `./gradlew runGameTest`.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "cytrabackups-gametest"
		enableGameTests = true
		// fabric-client-gametest-api-v1 starts at 1.21.4: the client tests are replaced by src/smoketest
		enableClientGameTests = false
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Permissions (LuckPerms etc.) with op-level fallback. Bundled (jar-in-jar).
	modImplementation "me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"
	include "me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"

	// Alloy UI: the Nocturne theme and widgets for the client menus (jar-in-jar)
	modImplementation "dev.steelaspect:alloy-ui:${project.alloyui_version}"
	include "dev.steelaspect:alloy-ui:${project.alloyui_version}"

	// Optional: Mod Menu config button (client). Loaded in dev runs and client game tests.
	// (Mod Menu 9.2.0 pulls a placeholder-api build no repo serves, hence transitive = false)
	modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
	modLocalRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }

	// Pure-Java zstd (no native code). Bundled (jar-in-jar).
	implementation "io.airlift:aircompressor:${project.aircompressor_version}"
	include "io.airlift:aircompressor:${project.aircompressor_version}"

	// Native zstd (all desktop/server platforms) for real compression levels and dictionary compression of chunks.
	// Bundled (jar-in-jar); the mod falls back to aircompressor when the native library cannot be loaded.
	implementation "com.github.luben:zstd-jni:${project.zstd_jni_version}"
	include "com.github.luben:zstd-jni:${project.zstd_jni_version}"

	// Pure-Java SFTP client for off-site copies. Bundled (jar-in-jar).
	implementation "com.github.mwiede:jsch:${project.jsch_version}"
	include "com.github.mwiede:jsch:${project.jsch_version}"

	// Optional: ./gradlew runGameTest -PwithSyncmatica loads the 1.20.4 Alloy Syncmatica port so the preview test also
	// checks sharing. SyncmaticaShare reaches it by reflection, so it is only a runtime dependency.
	def syncmaticaJar = file("${rootDir}/../Crytra-Syncmatica/build/libs/alloy-syncmatica-1.5.0+1.20.4.jar")
	if (project.hasProperty('withSyncmatica') && syncmaticaJar.exists()) {
		modLocalRuntime files(syncmaticaJar)
	}

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// the core only needs these at runtime outside Minecraft
	integrationTestImplementation "com.google.code.gson:gson:2.13.2"
	integrationTestImplementation "io.airlift:aircompressor:${project.aircompressor_version}"
	integrationTestImplementation "com.github.mwiede:jsch:${project.jsch_version}"
	integrationTestImplementation "com.github.luben:zstd-jni:${project.zstd_jni_version}"
	integrationTestImplementation platform("org.junit:junit-bom:${project.junit_version}")
	integrationTestImplementation "org.junit.jupiter:junit-jupiter"
	integrationTestRuntimeOnly "org.junit.platform:junit-platform-launcher"
	integrationTestImplementation "org.gaul:s3proxy:2.6.0"
	integrationTestImplementation "org.apache.sshd:sshd-core:2.16.0"
	integrationTestImplementation "org.apache.sshd:sshd-sftp:2.16.0"
	integrationTestImplementation "org.apache.tomcat.embed:tomcat-embed-core:11.0.26"
}

tasks.register("integrationTest", Test) {
	description = "Runs off-site copy tests against embedded S3, SFTP and WebDAV servers."
	group = "verification"
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}

// Client game tests need fabric-client-gametest-api-v1 (1.21.4+): not built on 1.20.4. Instead, src/smoketest is a
// small client mod run by ./smoketest.sh (through ./headless.sh): it joins a dedicated 1.20.4 server running the
// built jar, opens every menu through the 1.20.4 input methods and logs [BackupsSmoke] PASS/FAIL.
sourceSets {
	smoketest {
		compileClasspath += main.compileClasspath + main.output + client.compileClasspath + client.output
		runtimeClasspath += main.runtimeClasspath + main.output + client.runtimeClasspath + client.output
	}
}

loom {
	mods {
		'cytrabackups-smoke' { sourceSet sourceSets.smoketest }
	}
	runs {
		smokeTest {
			client()
			name 'Smoke test'
			source sourceSets.smoketest
			runDir 'build/run/smoke'
			vmArg '-Dcytrabackups.smoke=true'
			programArgs '--username', 'BackupsSmoke'
			ideConfigGenerated false
		}
	}
}

// Test games start muted.
tasks.matching { it.name == 'runSmokeTest' }.configureEach {
	doFirst {
		def options = file('build/run/smoke/options.txt')
		options.parentFile.mkdirs()
		def lines = options.exists() ? options.readLines().findAll { !it.startsWith('soundCategory_master:') } : []
		options.text = (lines + 'soundCategory_master:0.0').join('\n') + '\n'
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// Run one server game test: ./gradlew runGameTest -Pgt=<full test id>.
tasks.matching { it.name == 'runGameTest' }.configureEach {
	if (project.hasProperty('gt')) {
		jvmArgs "-Dfabric-api.gametest.filter=${project.property('gt')}"
	}
}
