plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/cytrabackups.accesswidener")

	mods {
		"cytrabackups" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Headless GameTests live in src/gametest and run with `./gradlew runGameTest`.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "cytrabackups-gametest"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Permissions (LuckPerms etc.) with op-level fallback. Bundled (jar-in-jar).
	modImplementation "me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"
	include "me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"

	// Pure-Java zstd (no native code). Bundled (jar-in-jar).
	implementation "io.airlift:aircompressor:${project.aircompressor_version}"
	include "io.airlift:aircompressor:${project.aircompressor_version}"

	// Pure-Java SFTP client for off-site copies. Bundled (jar-in-jar).
	implementation "com.github.mwiede:jsch:${project.jsch_version}"
	include "com.github.mwiede:jsch:${project.jsch_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
